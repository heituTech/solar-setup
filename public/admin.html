<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#772432" />
  <title>HEITU TECHNOLOGY</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-bar">
    <img class="app-bar-logo" src="img/logo.png" alt="HEITU Technology" />
    <div class="app-bar-actions">
      <a class="app-bar-link" href="/pv" data-i18n="home">Home</a>
      <a class="app-bar-link" href="/pv/account" data-i18n="my_account">My Account</a>
      <div class="lang-picker app-bar-picker" id="langPicker">
        <button class="lang-current" id="langCurrentBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu">
          <span id="langCurrentLabel">ខ្មែរ</span>
          <svg class="lang-chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="listbox" hidden>
          <button class="lang-option" type="button" data-lang="km" role="option">ខ្មែរ</button>
          <button class="lang-option" type="button" data-lang="en" role="option">English</button>
          <button class="lang-option" type="button" data-lang="zh" role="option">中文</button>
        </div>
      </div>
    </div>
  </div>

  <header class="page-head" id="portalHead">
    <h1 data-i18n="staff_portal">Staff Portal</h1>
  </header>

  <div class="container container-wide">
    <!-- Staff auth -->
    <div id="loginBox" class="auth-card card">
      <div class="segment" id="authTabs">
        <button class="active" data-mode="login" data-i18n="staff_login">Staff Login</button>
        <button data-mode="register" data-i18n="register">Register</button>
      </div>

      <div id="loginForm">
        <div class="field">
          <label data-i18n="login_identifier">Username / Email</label>
          <input type="text" id="loginIdentifier" autocomplete="username" data-i18n-placeholder="login_identifier_ph" placeholder="username or email" />
        </div>
        <div class="field">
          <label data-i18n="password">Password</label>
          <input type="password" id="loginPassword" autocomplete="current-password" data-i18n-placeholder="password" placeholder="Password" />
        </div>
        <button class="btn btn-primary" id="loginBtn" data-i18n="login">Login</button>
      </div>

      <div id="registerForm" style="display:none">
        <div class="field">
          <label data-i18n="full_name">Name</label>
          <input id="sr_name" maxlength="100" autocomplete="name" />
        </div>
        <div class="field">
          <label data-i18n="username">Username</label>
          <input id="sr_username" autocomplete="username" />
          <div class="select-note" data-i18n="username_hint"></div>
        </div>
        <div class="field">
          <label data-i18n="phone">Phone</label>
          <div class="phone-row">
            <select id="sr_phone_country"></select>
            <input id="sr_phone" autocomplete="tel" placeholder="1234567890" />
          </div>
        </div>
        <div class="field">
          <label data-i18n="email">Email</label>
          <div class="row">
            <input id="sr_email" type="email" autocomplete="email" placeholder="testmember@example.com" />
            <button class="btn btn-secondary btn-sm" id="sr_sendCode" style="width:auto" data-i18n="send_code">Send Code</button>
          </div>
        </div>
        <div class="field">
          <label data-i18n="verification_code">Verification Code</label>
          <input id="sr_code" inputmode="numeric" maxlength="6" />
        </div>
        <div class="field">
          <label data-i18n="password">Password</label>
          <input id="sr_password" type="password" autocomplete="new-password" />
          <div class="select-note" data-i18n="password_hint">At least 8 characters</div>
        </div>
        <div class="select-note" id="sr_devHint" style="display:none" data-i18n="dev_mode_hint"></div>
        <button class="btn btn-primary" id="registerBtn" data-i18n="register">Register</button>
      </div>
    </div>

    <!-- Panels -->
    <div id="adminPanel" style="display:none">
      <div class="user-bar card">
        <div class="user-info">
          <span id="userName" class="user-name"></span>
          <span id="userRoleBadge" class="role-badge"></span>
        </div>
      </div>

      <div class="tabs" id="mainTabs">
        <button class="tab-btn active" data-tab="products" data-i18n="products">Products</button>
        <button class="tab-btn" data-tab="accounts" data-i18n="tab_accounts">Accounts</button>
        <button class="tab-btn" data-tab="approvals" data-i18n="tab_approvals">Approvals</button>
        <button class="tab-btn" data-tab="settings" data-i18n="settings">Settings</button>
      </div>

      <!-- Products -->
      <div id="productsPanel" style="display:none">
        <div class="card toolbar">
          <div class="tabs sub-tabs">
            <button class="tab-btn active" data-cat="inverters" data-i18n="inverter_tab">Inverters</button>
            <button class="tab-btn" data-cat="panels" data-i18n="panel_tab">Solar Panels</button>
            <button class="tab-btn" data-cat="batteries" data-i18n="battery_tab">Batteries</button>
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-primary btn-sm" id="addProductBtn" style="width:auto" data-i18n="add_product">+ Add Product</button>
            <span class="inline-hint" id="productHint"></span>
          </div>
        </div>
        <div id="productFilters" class="filter-bar"></div>
        <div id="productList"></div>
      </div>

      <!-- Accounts -->
      <div id="accountsPanel" style="display:none">
        <div class="card toolbar">
          <span class="inline-hint" id="accountHint"></span>
          <button class="btn btn-primary btn-sm" id="addAccountBtn" style="width:auto" data-i18n="add_account">+ Add Account</button>
        </div>
        <div id="accountList"></div>
      </div>

      <!-- Approvals -->
      <div id="approvalsPanel" style="display:none">
        <div class="card toolbar">
          <div class="tabs sub-tabs" id="approvalScopeTabs">
            <button class="tab-btn active" data-scope="to_review" data-i18n="scope_to_review">To Review</button>
            <button class="tab-btn" data-scope="mine" data-i18n="scope_mine">My Requests</button>
          </div>
        </div>
        <div id="approvalList"></div>
      </div>

      <!-- Settings -->
      <div id="settingsPanel" style="display:none"></div>
    </div>
  </div>

  <!-- Product modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <h2 id="productModalTitle" data-i18n="add_product">Add Product</h2>
      <div id="productModalBody"></div>
      <div class="actions">
        <button class="btn btn-secondary" id="productCancel" data-i18n="cancel">Cancel</button>
        <button class="btn btn-primary" id="productSave" data-i18n="save">Save</button>
      </div>
    </div>
  </div>

  <!-- Account modal -->
  <div class="modal-overlay" id="accountModal">
    <div class="modal">
      <h2 id="accountModalTitle" data-i18n="add_account">Add Account</h2>
      <div id="accountModalBody"></div>
      <div class="actions">
        <button class="btn btn-secondary" id="accountCancel" data-i18n="cancel">Cancel</button>
        <button class="btn btn-primary" id="accountSave" data-i18n="save">Save</button>
      </div>
    </div>
  </div>

  <!-- Reject modal -->
  <div class="modal-overlay" id="reviewModal">
    <div class="modal">
      <h2 data-i18n="reject_reason">Reject Reason</h2>
      <div class="field">
        <label data-i18n="review_note">Note</label>
        <textarea id="reviewNote" rows="3" data-i18n-placeholder="review_note_ph" placeholder="Explain why this request is rejected"></textarea>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="reviewCancel" data-i18n="cancel">Cancel</button>
        <button class="btn btn-danger" id="reviewConfirm" style="width:auto" data-i18n="reject">Reject</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/i18n.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/product-catalog.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/select.js"></script>
</body>
</html>
