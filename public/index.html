<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#772432" />
  <title>HEITU TECHNOLOGY</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-bar">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <div class="sidebar-head">
      <img class="sidebar-logo" src="img/logo.png" alt="HEITU Technology" />
      <button class="icon-btn" id="sidebarClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-link active" href="/">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 11l9-8 9 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 10v10h14V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="home">Home</span>
      </a>
      <a class="sidebar-link" href="/member">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 21c0-4 3-6 7-6s7 2 7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="member_login">Member Login</span>
      </a>
      <a class="sidebar-link" href="/admin">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="nav_staff">Staff Login</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <span class="sidebar-label" data-i18n="lang_label">Language</span>
      <div class="lang-picker" id="langPicker">
        <button class="lang-current" id="langCurrentBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu">
          <span id="langCurrentLabel">ខ្មែរ</span>
          <svg class="lang-chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="listbox" hidden>
          <button class="lang-option" type="button" data-lang="km" role="option">ខ្មែរ</button>
          <button class="lang-option" type="button" data-lang="en" role="option">English</button>
          <button class="lang-option" type="button" data-lang="zh" role="option">中文</button>
        </div>
      </div>
    </div>
  </aside>

  <header class="page-head">
    <h1 data-i18n="app_title">Solar System Configurator</h1>
    <p data-i18n="app_subtitle">Get your customized solar power system</p>
  </header>

  <div class="container">
    <!-- Input form -->
    <div class="card">
      <div class="scope-notice" data-i18n="scope_notice"></div>
      <div class="row">
        <div class="field">
          <label><span data-i18n="day_peak_power">Day Peak Power (W)</span> <button type="button" class="info-btn" data-tip="load" title="?">?</button></label>
          <input type="number" id="dayPower" min="0" step="1" placeholder="e.g. 1500" />
        </div>
        <div class="field">
          <label data-i18n="day_hours">Day Usage Hours (sunlight)</label>
          <input type="number" id="dayHours" min="0" max="8" step="0.5" placeholder="e.g. 6" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label><span data-i18n="night_peak_power">Night Peak Power (W)</span> <button type="button" class="info-btn" data-tip="load" title="?">?</button></label>
          <input type="number" id="nightPower" min="0" step="1" placeholder="e.g. 500" />
        </div>
        <div class="field">
          <label data-i18n="night_hours">Night Usage Hours (no sunlight)</label>
          <input type="number" id="nightHours" min="0" max="16" step="0.5" placeholder="e.g. 4" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label data-i18n="has_grid">Grid Power Available</label>
          <select id="hasGrid">
            <option value="" data-i18n="has_grid_choose">Choose...</option>
            <option value="1" data-i18n="has_grid_yes">Grid available</option>
            <option value="0" data-i18n="has_grid_no">No grid</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="system_mode">System Mode</label>
          <select id="systemMode">
            <option value="" data-i18n="system_mode_choose">Choose a system mode</option>
            <option value="off-grid" data-i18n="mode_off_grid">Pure off-grid — battery required</option>
            <option value="hybrid" data-i18n="mode_hybrid">Hybrid / grid-tied — battery optional</option>
          </select>
          <div class="select-note" id="systemModeNote" data-i18n="system_mode_note"></div>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label data-i18n="autonomy_days">Backup Days</label>
          <input type="number" id="autonomyDays" min="0" step="0.5" value="1" data-i18n-placeholder="autonomy_days_ph" placeholder="e.g. 1" />
          <div class="select-note" id="autonomyWarn"></div>
        </div>
        <div class="field">
          <label data-i18n="battery_type">Battery Type</label>
          <select id="batteryType">
            <option value="" data-i18n="battery_any">Any</option>
            <option value="lead-acid" data-i18n="battery_lead_acid">Lead-acid</option>
            <option value="lfp" data-i18n="battery_lfp">LiFePO4</option>
            <option value="lithium-ternary" data-i18n="battery_ternary">Ternary Lithium</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label><span data-i18n="strategy">Configuration Strategy</span> <button type="button" class="info-btn" data-tip="strategy" title="?">?</button></label>
        <select id="strategy">
          <option value="1" data-i18n="strategy_1">High ROI, low generation guarantee</option>
          <option value="2" selected data-i18n="strategy_2">Medium ROI, medium generation (recommended)</option>
          <option value="3" data-i18n="strategy_3">Low ROI, high generation guarantee</option>
        </select>
      </div>
      <button class="btn btn-primary" id="calcBtn" data-i18n="calculate">Get Recommendation</button>
    </div>

    <!-- Results -->
    <div id="results"></div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Tip modal -->
  <div class="modal-overlay" id="tipModal">
    <div class="modal">
      <h2 id="tipTitle"></h2>
      <div id="tipBody" class="tip-body"></div>
      <div class="actions">
        <button class="btn btn-primary" id="tipClose" data-i18n="got_it">Got it</button>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
